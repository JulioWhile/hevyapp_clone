      min-height: max(884px, 100dvh);

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased overflow-hidden">
<!-- TopAppBar (Shared Component) -->
<header class="bg-zinc-950 border-b border-zinc-800 flex justify-between items-center w-full px-5 py-4 fixed top-0 z-40">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-blue-600 dark:text-blue-500" style="font-variation-settings: 'FILL' 1;">fitness_center</span>
<span class="font-['Lexend'] font-bold tracking-tight text-zinc-100 text-xl font-black tracking-tighter text-blue-500">LIFT_OS</span>
</div>
<div class="w-8 h-8 rounded-full overflow-hidden bg-zinc-800 ring-2 ring-transparent">
<img class="w-full h-full object-cover" data-alt="A highly detailed, close-up portrait of a determined female athlete in a dimly lit, high-end gym environment. The lighting is cinematic and high-contrast, utilizing deep shadows and a stark, cool blue rim light that matches a premium, minimalistic dark-mode fitness application aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAS3PcJ3jJv03ruK0Us-2tpCLyb4of5aD_JIc14HYK_5TEVqVI14GUtHFkRLs81WyOMtfa7DXhtarW66_mNmP1-CCR38g30U6COyVgtAHCP2sW8xSWW4RXv1mycoDVPXatE7_NMsVlscIc7Pi4hk2CnVICRtwH5_eC7VxowVZw2BuL6PO0lYkxi12I4T60MVWB-De1rxrLMvjXFSOxcJr4OjzgNxiosweQNfslIutiGgjnLPbYVzotxqe4eNFqGd0sKcXuoJsC__Cg"/>
</div>
</header>
<!-- Canvas: Active Workout (Subtly Blurred & Scaled Down to emphasize background state) -->
<main class="pt-24 px-margin-mobile pb-8 flex-1 filter blur-[4px] opacity-40 scale-[0.98] origin-top transition-all duration-300 pointer-events-none select-none">
<div class="flex items-center justify-between mb-8">
<h1 class="font-headline-lg text-headline-lg text-on-surface">Chest &amp; Triceps</h1>
<div class="flex items-center gap-2 text-outline">
<span class="material-symbols-outlined">timer</span>
<span class="font-label-bold text-label-bold">42:15</span>
</div>
</div>
<!-- Simulated Workout Card -->
<div class="bg-surface-container-low border border-outline-variant rounded-xl p-md mb-md shadow-sm">
<div class="flex justify-between items-center mb-6">
<h2 class="font-headline-md text-headline-md text-primary">Flat Bench Press</h2>
<span class="material-symbols-outlined text-outline hover:text-on-surface transition-colors">more_horiz</span>
</div>
<!-- Headers -->
<div class="grid grid-cols-4 gap-4 mb-3 px-2">
<div class="font-label-sm text-label-sm text-outline uppercase tracking-wider text-center">Set</div>
<div class="font-label-sm text-label-sm text-outline uppercase tracking-wider text-center">Lbs</div>
<div class="font-label-sm text-label-sm text-outline uppercase tracking-wider text-center">Reps</div>
<div class="font-label-sm text-label-sm text-outline uppercase tracking-wider text-center">Done</div>
</div>
<!-- Set 1 (Completed) -->
<div class="grid grid-cols-4 gap-4 items-center bg-surface-container rounded-lg p-2 mb-2 border border-transparent">
<div class="font-label-bold text-label-bold text-on-surface text-center">1</div>
<div class="font-label-bold text-label-bold text-on-surface text-center">225</div>
<div class="font-label-bold text-label-bold text-on-surface text-center">8</div>
<div class="flex justify-center">
<div class="w-8 h-8 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
</div>
<!-- Set 2 (Just Completed - Triggered Timer) -->
<div class="grid grid-cols-4 gap-4 items-center bg-surface-container-high rounded-lg p-2 mb-2 border border-outline-variant">
<div class="font-label-bold text-label-bold text-on-surface text-center">2</div>
<div class="font-label-bold text-label-bold text-on-surface text-center">225</div>
<div class="font-label-bold text-label-bold text-on-surface text-center">6</div>
<div class="flex justify-center">
<div class="w-8 h-8 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
</div>
</div>
</main>
<!-- Overlay: Rest Timer Modal -->
<div class="fixed inset-0 z-50 flex flex-col items-center justify-center pt-24 pb-safe px-margin-mobile bg-background/85 backdrop-blur-xl">
<!-- Main Timer Visualization -->
<div class="relative flex items-center justify-center w-[280px] h-[280px] mb-12">
<!-- SVG Progress Ring -->
<svg class="absolute inset-0 w-full h-full transform -rotate-90 drop-shadow-lg" viewbox="0 0 100 100">
<!-- Background Track -->
<circle class="text-surface-container-highest" cx="50" cy="50" fill="none" r="46" stroke="currentColor" stroke-width="3"></circle>
<!-- Active Progress (Warm Orange / Tertiary) -->
<circle class="text-tertiary transition-all duration-1000 ease-linear" cx="50" cy="50" fill="none" r="46" stroke="currentColor" stroke-dasharray="289.02" stroke-dashoffset="60" stroke-linecap="round" stroke-width="4"></circle>
</svg>
<!-- Timer Text Content -->
<div class="flex flex-col items-center text-center z-10 mt-2">
<span class="font-label-sm text-label-sm text-tertiary uppercase tracking-[0.25em] mb-2 flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-tertiary animate-pulse"></span>
                    Resting
                </span>
<span class="font-display-metric text-display-metric text-on-surface text-[64px] leading-none tabular-nums tracking-tighter">01:30</span>
<span class="font-label-sm text-label-sm text-outline mt-3">+30s remaining</span>
</div>
</div>
<!-- Quick Adjust & Skip Controls -->
<div class="flex items-center gap-md mb-auto w-full max-w-[320px] justify-center">
<!-- -15s Button -->
<button class="w-[64px] h-[64px] shrink-0 rounded-full bg-surface-container border border-outline-variant flex items-center justify-center text-on-surface hover:bg-surface-container-high hover:border-outline active:scale-95 transition-all shadow-sm">
<span class="font-label-bold text-label-bold">-15</span>
</button>
<!-- Skip Button (Primary Action) -->
<button class="flex-1 h-[64px] rounded-full bg-surface-container-high border border-outline-variant flex items-center justify-center text-on-surface gap-2 hover:bg-surface-bright active:scale-95 transition-all shadow-sm">
<span class="font-label-bold text-label-bold uppercase tracking-wide">Skip</span>
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">skip_next</span>
</button>
<!-- +15s Button -->
<button class="w-[64px] h-[64px] shrink-0 rounded-full bg-surface-container border border-outline-variant flex items-center justify-center text-on-surface hover:bg-surface-container-high hover:border-outline active:scale-95 transition-all shadow-sm">
<span class="font-label-bold text-label-bold">+15</span>
</button>
</div>
<!-- Up Next Context Card -->
<div class="w-full max-w-sm mt-8 mb-6">
<div class="bg-surface-container-low border border-outline-variant rounded-xl p-md flex items-center gap-md shadow-lg relative overflow-hidden">
<!-- Subtle Gradient Accent -->
<div class="absolute left-0 top-0 bottom-0 w-1 bg-gradient-to-b from-primary to-transparent"></div>
<div class="w-12 h-12 rounded-lg bg-surface-container-highest flex items-center justify-center text-outline shrink-0">
<span class="material-symbols-outlined text-[24px]">fitness_center</span>
</div>
<div class="flex-1 min-w-0">
<p class="font-label-sm text-label-sm text-primary mb-1 uppercase tracking-wider flex items-center gap-1">
                        Up Next
                    </p>
<p class="font-label-bold text-label-bold text-on-surface truncate">Incline Dumbbell Press</p>
<div class="flex items-center gap-2 mt-1">
<span class="font-body-md text-[13px] text-on-surface-variant bg-surface-container px-2 py-0.5 rounded-sm">Set 3</span>
<span class="w-1 h-1 rounded-full bg-outline-variant"></span>
<span class="font-body-md text-[13px] text-on-surface-variant">8 Reps</span>
<span class="w-1 h-1 rounded-full bg-outline-variant"></span>
<span class="font-body-md text-[13px] text-on-surface-variant">80 Lbs</span>
</div>
</div>
</div>
</div>
</div>
</body></html>
