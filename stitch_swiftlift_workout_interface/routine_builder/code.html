<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Routine Builder</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;family=Lexend:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-tint": "#adc6ff",
                        "on-secondary-container": "#003a11",
                        "surface": "#131313",
                        "surface-variant": "#353534",
                        "on-tertiary-fixed-variant": "#6a3b00",
                        "tertiary-container": "#d47b00",
                        "surface-container-highest": "#353534",
                        "on-secondary-fixed-variant": "#00531c",
                        "on-background": "#e5e2e1",
                        "outline-variant": "#414755",
                        "error": "#ffb4ab",
                        "on-primary": "#002e69",
                        "inverse-primary": "#005bc1",
                        "secondary": "#53e16f",
                        "on-surface": "#e5e2e1",
                        "on-tertiary-fixed": "#2d1600",
                        "secondary-fixed-dim": "#53e16f",
                        "outline": "#8b90a0",
                        "primary-fixed": "#d8e2ff",
                        "tertiary-fixed-dim": "#ffb874",
                        "primary": "#adc6ff",
                        "on-tertiary-container": "#412200",
                        "surface-container-high": "#2a2a2a",
                        "primary-container": "#4b8eff",
                        "surface-container-low": "#1c1b1b",
                        "on-error-container": "#ffdad6",
                        "background": "#131313",
                        "on-secondary-fixed": "#002107",
                        "inverse-surface": "#e5e2e1",
                        "surface-dim": "#131313",
                        "on-tertiary": "#4b2800",
                        "on-primary-fixed-variant": "#004493",
                        "on-secondary": "#003911",
                        "on-surface-variant": "#c1c6d7",
                        "surface-bright": "#393939",
                        "tertiary": "#ffb874",
                        "primary-fixed-dim": "#adc6ff",
                        "secondary-container": "#05b046",
                        "surface-container": "#201f1f",
                        "on-primary-fixed": "#001a41",
                        "tertiary-fixed": "#ffdcbf",
                        "secondary-fixed": "#72fe88",
                        "on-error": "#690005",
                        "on-primary-container": "#00285c",
                        "surface-container-lowest": "#0e0e0e",
                        "inverse-on-surface": "#313030",
                        "error-container": "#93000a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "xl": "32px",
                        "md": "16px",
                        "touch-target-min": "44px",
                        "gutter": "12px",
                        "margin-mobile": "20px",
                        "sm": "12px",
                        "lg": "24px",
                        "xs": "8px",
                        "base": "4px"
                    },
                    "fontFamily": {
                        "label-sm": ["Inter"],
                        "headline-md": ["Lexend"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-bold": ["Inter"],
                        "display-metric": ["Lexend"],
                        "headline-lg": ["Lexend"]
                    },
                    "fontSize": {
                        "label-sm": ["12px", { "lineHeight": "1.2", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "label-bold": ["14px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "display-metric": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Hide scrollbar for cleaner UI */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md text-body-md antialiased selection:bg-primary selection:text-on-primary">
<!-- Screen-Specific Header (Task-Focused Flow, Global Nav Suppressed) -->
<header class="flex items-center justify-between px-margin-mobile py-sm border-b border-outline-variant sticky top-0 bg-background/95 backdrop-blur-md z-40">
<button aria-label="Cancel" class="w-touch-target-min h-touch-target-min flex items-center justify-start text-on-surface-variant hover:text-on-surface transition-colors rounded-full">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
<div class="flex-1 flex justify-center">
<input class="bg-transparent border-none text-center font-headline-md text-headline-md focus:ring-0 focus:outline-none w-full text-on-surface p-0 m-0 placeholder:text-outline" placeholder="Routine Name" type="text" value="Leg Day"/>
</div>
<button aria-label="Save Template" class="h-touch-target-min flex items-center justify-end text-primary font-label-bold text-label-bold hover:text-primary-fixed transition-colors">
            Save
        </button>
</header>
<!-- Main Canvas -->
<main class="flex-1 overflow-y-auto px-margin-mobile py-lg pb-32">
<div class="space-y-sm">
<!-- Exercise Card 1 -->
<div class="bg-surface-container border border-outline-variant rounded-xl p-sm flex items-center shadow-[0_2px_8px_rgba(0,0,0,0.2)] active:bg-surface-container-high transition-colors group">
<div aria-label="Drag to reorder" class="w-touch-target-min h-touch-target-min flex items-center justify-center cursor-grab text-outline group-hover:text-on-surface transition-colors">
<span class="material-symbols-outlined text-[20px]">drag_indicator</span>
</div>
<div class="flex-1 px-xs">
<h3 class="font-label-bold text-label-bold text-on-surface line-clamp-1">Barbell Back Squat</h3>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-1">4 Sets • 8-12 Reps</p>
</div>
<button aria-label="Remove exercise" class="w-touch-target-min h-touch-target-min flex items-center justify-center text-outline hover:text-error transition-colors rounded-full">
<span class="material-symbols-outlined text-[20px]">delete</span>
</button>
</div>
<!-- Exercise Card 2 -->
<div class="bg-surface-container border border-outline-variant rounded-xl p-sm flex items-center shadow-[0_2px_8px_rgba(0,0,0,0.2)] active:bg-surface-container-high transition-colors group">
<div aria-label="Drag to reorder" class="w-touch-target-min h-touch-target-min flex items-center justify-center cursor-grab text-outline group-hover:text-on-surface transition-colors">
<span class="material-symbols-outlined text-[20px]">drag_indicator</span>
</div>
<div class="flex-1 px-xs">
<h3 class="font-label-bold text-label-bold text-on-surface line-clamp-1">Romanian Deadlift</h3>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-1">3 Sets • 10-12 Reps</p>
</div>
<button aria-label="Remove exercise" class="w-touch-target-min h-touch-target-min flex items-center justify-center text-outline hover:text-error transition-colors rounded-full">
<span class="material-symbols-outlined text-[20px]">delete</span>
</button>
</div>
<!-- Exercise Card 3 -->
<div class="bg-surface-container border border-outline-variant rounded-xl p-sm flex items-center shadow-[0_2px_8px_rgba(0,0,0,0.2)] active:bg-surface-container-high transition-colors group">
<div aria-label="Drag to reorder" class="w-touch-target-min h-touch-target-min flex items-center justify-center cursor-grab text-outline group-hover:text-on-surface transition-colors">
<span class="material-symbols-outlined text-[20px]">drag_indicator</span>
</div>
<div class="flex-1 px-xs">
<h3 class="font-label-bold text-label-bold text-on-surface line-clamp-1">Leg Press</h3>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-1">3 Sets • 12-15 Reps</p>
</div>
<button aria-label="Remove exercise" class="w-touch-target-min h-touch-target-min flex items-center justify-center text-outline hover:text-error transition-colors rounded-full">
<span class="material-symbols-outlined text-[20px]">delete</span>
</button>
</div>
<!-- Exercise Card 4 -->
<div class="bg-surface-container border border-outline-variant rounded-xl p-sm flex items-center shadow-[0_2px_8px_rgba(0,0,0,0.2)] active:bg-surface-container-high transition-colors group">
<div aria-label="Drag to reorder" class="w-touch-target-min h-touch-target-min flex items-center justify-center cursor-grab text-outline group-hover:text-on-surface transition-colors">
<span class="material-symbols-outlined text-[20px]">drag_indicator</span>
</div>
<div class="flex-1 px-xs">
<h3 class="font-label-bold text-label-bold text-on-surface line-clamp-1">Calf Raises</h3>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-1">4 Sets • 15-20 Reps</p>
</div>
<button aria-label="Remove exercise" class="w-touch-target-min h-touch-target-min flex items-center justify-center text-outline hover:text-error transition-colors rounded-full">
<span class="material-symbols-outlined text-[20px]">delete</span>
</button>
</div>
</div>
</main>
<!-- Fixed Bottom Action Area (Thumb Zone) -->
<div class="fixed bottom-0 left-0 w-full px-margin-mobile pb-[max(env(safe-area-inset-bottom),20px)] pt-xl bg-gradient-to-t from-background via-background/95 to-transparent z-40 pointer-events-none">
<div class="pointer-events-auto">
<button class="w-full h-[56px] bg-primary text-on-primary font-label-bold text-label-bold rounded-xl flex items-center justify-center gap-xs shadow-[0_4px_12px_rgba(0,0,0,0.3)] active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">add</span>
                Add Exercise
            </button>
</div>
</div>
</body></html>
