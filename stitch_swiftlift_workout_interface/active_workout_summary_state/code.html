<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Workout Summary</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

            theme: {

                        "on-secondary-container": "#003a11",
                        "inverse-primary": "#005bc1",
                        "primary": "#adc6ff",
                        "error-container": "#93000a",
                        "on-tertiary-fixed": "#2d1600",
                        "secondary": "#53e16f",
                        "primary-fixed-dim": "#adc6ff",
                        "surface-container-highest": "#353534",
                        "on-error": "#690005",
                        "on-surface": "#e5e2e1",

                        "on-primary-fixed": "#001a41",

                        "surface-bright": "#393939",
                        "on-tertiary-container": "#412200",
                        "on-error-container": "#ffdad6",
                        "background": "#131313",
                        "inverse-surface": "#e5e2e1",
                        "error": "#ffb4ab",
                        "on-secondary-fixed": "#002107",
                        "secondary-fixed": "#72fe88",
                        "inverse-on-surface": "#313030",

                        "primary-fixed": "#d8e2ff"

                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "lg": "24px",
                        "md": "16px",
                        "xs": "8px",
                        "base": "4px",
                        "gutter": "12px",
                        "sm": "12px",
                        "touch-target-min": "44px",
                        "margin-mobile": "20px",
                        "xl": "32px"
                    },
                    "fontFamily": {
                        "label-bold": ["Inter"],
                        "headline-md": ["Lexend"],

                    "fontSize": {

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-zinc-950 flex justify-between items-center w-full px-5 py-4 border-b border-zinc-800 docked full-width top-0 sticky z-50">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-blue-600 dark:text-blue-500 text-xl" data-icon="fitness_center">fitness_center</span>
<span class="font-['Lexend'] font-bold tracking-tight text-zinc-100 text-xl tracking-tighter text-blue-500">LIFT_OS</span>
</div>
<div class="w-8 h-8 rounded-full overflow-hidden bg-surface-variant flex items-center justify-center">
<img alt="User profile photo" class="w-full h-full object-cover" data-alt="A close-up portrait of a determined athlete. The lighting is dramatic and moody, emphasizing fitness and focus. High-contrast shadows define facial features. The background is a stark, clean dark gray to match the high-end fitness app aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDA70mIQqyb-OB69QnytPi4XEAxmomm0HVULLArz2G9F3403HZN-qXrv_Aiu0pvCVeiD-0_p47R8nygrKOmQ1lVhowiMUWXZ8IS3zbjkFzg07snf2878ImHg28ePKNdY_JC0bgA0VEx-QWHq971npekY3lDQbMOUF9qMbdmR78chi7Wl3yj9HwLGoyYCjSH43WGPNg8FM2Bjah0FrxhlePu8_2DOvFPB9zEOm23zXUVtond2KVELM-qUxjeIlsfCxPT-hV_btflKDI"/>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-margin-mobile py-lg pb-32 flex flex-col items-center">
<!-- Celebration Header -->
<div class="text-center mb-xl flex flex-col items-center">
<div class="w-20 h-20 bg-secondary-container rounded-full flex items-center justify-center mb-md shadow-[0_0_24px_rgba(5,176,70,0.4)]">
<span class="material-symbols-outlined text-on-secondary-container text-[40px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-secondary mb-xs">Workout Complete</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Upper Body Power Day</p>
</div>
<!-- Metrics Bento Grid -->
<div class="grid grid-cols-2 gap-md w-full max-w-md mb-xl">
<!-- Duration Card -->
<div class="bg-surface border border-outline-variant rounded-xl p-md flex flex-col items-center justify-center relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-br from-primary/5 to-transparent z-0"></div>
<div class="relative z-10 flex flex-col items-center">
<span class="material-symbols-outlined text-outline mb-xs">timer</span>
<span class="font-display-metric text-display-metric text-on-surface">52<span class="text-headline-md text-outline">m</span></span>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mt-1">Duration</span>
</div>
</div>
<!-- Volume Card -->
<div class="bg-surface border border-outline-variant rounded-xl p-md flex flex-col items-center justify-center relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-br from-primary/5 to-transparent z-0"></div>
<div class="relative z-10 flex flex-col items-center">
<span class="material-symbols-outlined text-outline mb-xs">weight</span>
<span class="font-display-metric text-display-metric text-on-surface">12.4<span class="text-headline-md text-outline">k</span></span>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mt-1">Volume (lbs)</span>
</div>
</div>
<!-- Sets Card -->
<div class="col-span-2 bg-surface border border-outline-variant rounded-xl p-md flex justify-between items-center relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-r from-surface to-surface-container-high z-0"></div>
<div class="relative z-10 flex items-center gap-sm">
<div class="w-10 h-10 rounded-full bg-surface-container-highest flex items-center justify-center">
<span class="material-symbols-outlined text-outline">repeat</span>
</div>
<span class="font-label-bold text-label-bold text-on-surface">Total Sets</span>
</div>
<div class="relative z-10 font-headline-md text-headline-md text-on-surface">24</div>
</div>
</div>
<!-- Personal Records Section -->
<div class="w-full max-w-md mb-xl">
<h2 class="font-label-bold text-label-bold text-outline-variant uppercase tracking-wider mb-sm">Achievements</h2>
<div class="bg-surface-container-highest border border-tertiary-container/30 rounded-xl p-md flex items-center gap-md relative overflow-hidden shadow-[0_4px_12px_rgba(212,123,0,0.15)]">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-tertiary-container"></div>
<div class="w-12 h-12 bg-tertiary-container/10 rounded-full flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-tertiary text-2xl" style="font-variation-settings: 'FILL' 1;">emoji_events</span>
</div>
<div class="flex-1">
<div class="font-label-bold text-label-bold text-tertiary mb-1">New Personal Record</div>
<div class="font-body-md text-body-md text-on-surface">Bench Press • 225 lbs</div>
</div>
</div>
</div>
<!-- Action Area (Thumb Zone) -->
<div class="fixed bottom-0 left-0 w-full px-margin-mobile pb-[30px] pt-md bg-gradient-to-t from-background via-background to-transparent flex flex-col gap-sm items-center z-40">
<button class="w-full max-w-md h-touch-target-min bg-primary-container text-on-primary-container font-label-bold text-label-bold rounded-xl flex items-center justify-center gap-2 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-lg">check</span>
                Done
            </button>
<button class="w-full max-w-md h-touch-target-min bg-transparent text-primary font-label-bold text-label-bold rounded-xl border border-primary/30 flex items-center justify-center gap-2 active:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-lg">ios_share</span>
                Share Workout
            </button>
</div>
</main>
</body></html>
