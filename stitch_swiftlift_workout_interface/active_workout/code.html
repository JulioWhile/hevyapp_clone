<style>
        /* Hide number input arrows for clean minimalist look */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button {

            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col overflow-x-hidden selection:bg-primary/30">
<!-- Back-to-Main Header (Exception Rule Applied) -->
<header class="flex items-center justify-between px-margin-mobile py-sm bg-surface/95 backdrop-blur-md sticky top-0 z-50 border-b border-outline-variant/30">
<button aria-label="Go back" class="w-touch-target-min h-touch-target-min flex items-center justify-start text-primary active:opacity-70 transition-opacity">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<div class="flex items-center gap-xs text-tertiary">
<span class="material-symbols-outlined text-[18px]">schedule</span>
<span class="font-display-metric text-[20px] font-bold tracking-tight">00:42:15</span>
</div>
<button aria-label="Workout options" class="w-touch-target-min h-touch-target-min flex items-center justify-end text-on-surface-variant active:opacity-70 transition-opacity">
<span class="material-symbols-outlined text-[24px]">more_vert</span>
</button>
</header>

<div class="absolute inset-0 bg-gradient-to-t from-surface to-surface/20"></div>
<div class="absolute bottom-md left-margin-mobile right-margin-mobile flex justify-between items-end">
<h1 class="font-headline-lg text-headline-lg text-on-surface leading-none">Hypertrophy<br/><span class="text-primary font-headline-md text-[24px]">Upper Body</span></h1>
</div>
</div>
<div class="px-margin-mobile py-lg flex flex-col gap-xl">
<!-- Exercise Block 1: Bench Press -->
<section class="flex flex-col gap-md">
<header class="flex justify-between items-center">
<h2 class="font-headline-md text-headline-md text-on-surface">Bench Press</h2>
<button class="text-primary h-touch-target-min px-2 flex items-center justify-center rounded hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-[24px]">swap_horiz</span>
</button>
</header>
<!-- Swipeable Context Cards -->
<div class="flex overflow-x-auto gap-sm pb-2 -mx-margin-mobile px-margin-mobile snap-x scrollbar-hide">
<div class="snap-start shrink-0 w-48 bg-surface-container-low rounded-xl border border-outline-variant p-sm flex flex-col gap-1 shadow-sm">
<div class="flex items-center gap-1 text-outline font-label-sm text-label-sm uppercase tracking-wider">
<span class="material-symbols-outlined text-[14px]">history</span> Last Workout
                        </div>
<div class="font-display-metric text-[24px] text-on-surface">225 <span class="text-on-surface-variant font-body-md text-[14px]">lbs x 8</span></div>
</div>
<div class="snap-start shrink-0 w-48 bg-surface-container-low rounded-xl border border-outline-variant p-sm flex flex-col gap-1 shadow-sm">
<div class="flex items-center gap-1 text-tertiary font-label-sm text-label-sm uppercase tracking-wider">
<span class="material-symbols-outlined text-[14px]">target</span> Goal Today
                        </div>
<div class="font-display-metric text-[24px] text-on-surface">235 <span class="text-on-surface-variant font-body-md text-[14px]">lbs x 6</span></div>
</div>

<div>Prev</div>
<div class="text-center">LBS</div>
<div class="text-center">Reps</div>
<div class="text-center"></div>
</div>

<div class="font-body-md text-body-md text-on-surface-variant truncate opacity-60">205 x 10</div>
<div>
<input class="w-full h-12 bg-transparent border-none text-center font-display-metric text-[20px] text-on-surface focus:ring-0 opacity-60" inputmode="decimal" readonly="" type="number" value="205"/>
</div>
<div>
<input class="w-full h-12 bg-transparent border-none text-center font-display-metric text-[20px] text-on-surface focus:ring-0 opacity-60" inputmode="numeric" readonly="" type="number" value="10"/>
</div>
<button class="w-full h-12 flex items-center justify-center bg-secondary text-on-secondary rounded flex-shrink-0 shadow-[0_2px_8px_rgba(83,225,111,0.2)]">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">check</span>
</button>
</div>

<div class="text-center font-label-bold text-label-bold text-primary">2</div>
<div class="font-body-md text-body-md text-on-surface-variant truncate">225 x 8</div>

</div>
<div>
<input class="w-full h-12 bg-surface-container-highest border border-outline-variant/50 rounded lg text-center font-display-metric text-[22px] text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:bg-surface-container-highest transition-colors" inputmode="numeric" type="number" value="8"/>
</div>
<button class="w-full h-12 flex items-center justify-center bg-surface-container-highest border border-outline-variant text-outline rounded hover:border-secondary hover:text-secondary hover:bg-secondary/10 transition-colors flex-shrink-0">
<span class="material-symbols-outlined text-[28px]">check</span>
</button>
</div>

<div class="grid grid-cols-[32px_1fr_64px_64px_56px] gap-2 items-center bg-surface-container-low rounded-lg p-1 pr-2 border border-transparent transition-all opacity-70">
<div class="text-center font-label-bold text-label-bold text-on-surface-variant">3</div>

<div>
<input class="w-full h-12 bg-surface-container border border-outline-variant/30 rounded lg text-center font-display-metric text-[20px] text-on-surface focus:border-primary focus:ring-1 focus:ring-primary transition-colors" inputmode="decimal" placeholder="-" type="number"/>
</div>
<div>
<input class="w-full h-12 bg-surface-container border border-outline-variant/30 rounded lg text-center font-display-metric text-[20px] text-on-surface focus:border-primary focus:ring-1 focus:ring-primary transition-colors" inputmode="numeric" placeholder="-" type="number"/>
</div>
<button class="w-full h-12 flex items-center justify-center bg-surface-container border border-outline-variant/30 text-outline/50 rounded flex-shrink-0">
<span class="material-symbols-outlined text-[28px]">check</span>
</button>
</div>
<!-- Add Set Button -->
<button class="w-full h-12 mt-2 bg-primary/10 text-primary font-label-bold text-label-bold rounded-lg border border-primary/20 flex items-center justify-center gap-xs hover:bg-primary/20 transition-colors">
<span class="material-symbols-outlined text-[20px]">add</span> Add Set

</div>

<div class="flex items-center justify-between gap-md max-w-md mx-auto">
<!-- Rest Timer (Warm Orange for Time Sensitivity) -->
<button class="flex flex-col items-start justify-center pl-2 rounded-lg active:opacity-70 transition-opacity">
<span class="font-label-sm text-label-sm text-outline uppercase tracking-wider mb-[-2px]">Rest Timer</span>
<div class="flex items-center gap-xs text-tertiary">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">timer</span>
<span class="font-display-metric text-[28px] leading-none tracking-tighter">01:45</span>
</div>
</button>
<!-- Primary Action -->
<button class="h-14 px-xl bg-primary text-on-primary font-label-bold text-[16px] tracking-wide rounded-lg flex items-center justify-center gap-2 shadow-[0_4px_16px_rgba(173,198,255,0.15)] active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[20px]">flag</span>
                Finish Workout
            </button>
</div>
